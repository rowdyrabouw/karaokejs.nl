<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathless — Karaoke</title>
    <script src="/assets/js/script.js" defer></script>
    <script src="assets/js/script.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <div class="cover-wrap">
        <img
          class="cover-art"
          src="assets/img/the-script.jpg"
          alt="The Script"
        />
        <div class="cover-caption">The Script - The Man Who Can’t Be Moved</div>
      </div>

      <div class="info-panel">
        <div class="playback-controls" role="group" aria-label="Audio playback">
          <button
            class="playback-button is-selected"
            id="play-audio"
            type="button"
          >
            Play
          </button>
          <button class="playback-button" id="pause-audio" type="button">
            Pause
          </button>
        </div>
        <p id="playback-error" role="alert" hidden></p>
        <div class="status-box">
          <p id="status">Status: Ready</p>
          <p id="timeupdate">Current Time: 0.00 seconds</p>
        </div>

        <div class="player-shell">
          <audio controls>
            <source
              src="assets/mp3/the-script-the-man-who-can-t-be-moved.mp3"
              type="audio/mpeg"
            />
          </audio>
        </div>
      </div>
    </main>
  </body>
</html>
