<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathless — Karaoke</title>
    <script src="/assets/js/script.js" defer></script>
    <script src="assets/js/script.js" defer></script>
    <link rel="stylesheet" href="assets/css/style.css?v=10" />
  </head>
  <body>
    <main>
      <div class="cover-wrap">
        <img
          class="cover-art"
          src="assets/img/snow-patrol.jpg"
          alt="Snow Patrol"
        />
        <div class="cover-caption">Snow Patrol - Chasing Cars</div>
      </div>

      <div class="info-panel">
        <div class="status-box">
          <div class="lyrics-display" aria-live="polite"></div>
          <div class="visualizer-stage">
            <canvas id="visualizer" role="img" aria-label="Live audio waveform">
              Live audio waveform
            </canvas>
            <p id="visualizer-error" role="alert" hidden></p>
          </div>
        </div>

        <div class="player-shell">
          <div class="control-row">
            <div
              class="visualizer-controls"
              role="group"
              aria-label="Visualizer type"
            >
              <button
                class="visualizer-button is-selected"
                type="button"
                data-visualizer="waveform"
                aria-pressed="true"
              >
                Waveform
              </button>
              <button
                class="visualizer-button"
                type="button"
                data-visualizer="frequency"
                aria-pressed="false"
              >
                Frequency
              </button>
              <button
                class="visualizer-button"
                type="button"
                data-visualizer="radial"
                aria-pressed="false"
              >
                Radial
              </button>
              <button
                class="visualizer-button"
                type="button"
                data-visualizer="terrain"
                aria-pressed="false"
              >
                Mountain
              </button>
              <button
                class="visualizer-button"
                type="button"
                data-visualizer="particles"
                aria-pressed="false"
              >
                Particles
              </button>
              <button
                class="visualizer-button"
                type="button"
                data-random-visualizer
                aria-pressed="false"
              >
                Random
              </button>
            </div>
            <div class="track-switch" role="group" aria-label="Audio track">
              <button
                class="track-button is-selected"
                type="button"
                data-track="vocals"
                aria-pressed="true"
              >
                With vocals
              </button>
              <button
                class="track-button"
                type="button"
                data-track="instrumental"
                aria-pressed="false"
              >
                Without vocals
              </button>
            </div>
          </div>
          <div class="player-controls">
            <button
              class="play-button"
              id="playback-toggle"
              type="button"
              aria-label="Play"
              title="Play"
            >
              <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m8 5 11 7-11 7z" />
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 5h4v14H7zM15 5h4v14h-4z" />
              </svg>
            </button>
            <div class="timeline">
              <span class="time" id="current-time">0:00</span>
              <label class="sr-only" for="seek">Seek through song</label>
              <input
                class="range seek-range"
                id="seek"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-valuetext="0:00 of 0:00"
              />
              <span class="time" id="duration">0:00</span>
            </div>
            <label class="volume-control">
              <span class="sr-only">Volume</span>
              <input
                class="range volume-range"
                id="volume"
                type="range"
                min="0"
                max="1"
                value="1"
                step="0.01"
              />
            </label>
          </div>
          <p class="player-message" id="player-message" role="status"></p>
          <audio
            id="audio"
            preload="metadata"
            src="assets/mp3/snow-patrol-chasing-cars-original.mp3"
            data-active-track="vocals"
            data-vocals="assets/mp3/snow-patrol-chasing-cars-original.mp3"
            data-instrumental="assets/mp3/snow-patrol-chasing-cars-instrumental.mp3"
          ></audio>
        </div>
      </div>
    </main>
  </body>
</html>
