<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breathless — Karaoke</title>
    <script src="assets/js/script.js?v=14" defer></script>
    <link rel="stylesheet" href="assets/css/style.css?v=4" />
  </head>
  <body>
    <main>
      <div class="cover-wrap">
        <img class="cover-art" src="assets/img/obskur.jpg" alt="Obskür" />
        <div class="cover-caption">Obskür - Bayside</div>
      </div>

      <div class="info-panel">
        <div class="status-box">
          <div
            class="visualizer-controls"
            role="group"
            aria-label="Visualizer type"
          >
            <button
              class="visualizer-button is-selected"
              type="button"
              data-visualizer="waveform"
              aria-pressed="true"
            >
              Waveform
            </button>
            <button
              class="visualizer-button"
              type="button"
              data-visualizer="frequency"
              aria-pressed="false"
            >
              Frequency
            </button>
            <button
              class="visualizer-button"
              type="button"
              data-visualizer="radial"
              aria-pressed="false"
            >
              Radial
            </button>
            <button
              class="visualizer-button"
              type="button"
              data-visualizer="terrain"
              aria-pressed="false"
            >
              Mountain
            </button>
            <button
              class="visualizer-button"
              type="button"
              data-visualizer="particles"
              aria-pressed="false"
            >
              Particles
            </button>
          </div>
          <div class="visualizer-stage">
            <canvas
              id="visualizer"
              role="img"
              aria-label="Live audio waveform"
            >
              Live audio waveform
            </canvas>
            <p id="visualizer-error" role="alert" hidden></p>
          </div>
        </div>

        <div class="player-shell">
          <audio controls>
            <source src="assets/mp3/obskur-bayside.mp3" type="audio/mpeg" />
          </audio>
        </div>
      </div>
    </main>
  </body>
</html>
